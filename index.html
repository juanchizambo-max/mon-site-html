		<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let x = 250;
let y = 150;
let dx = 3;
let dy = 3;

function pong(){

ctx.clearRect(0,0,500,300);

ctx.fillStyle = "white";
ctx.fillRect(x,y,10,10);

x += dx;
y += dy;

if(x < 0 || x > 490) dx = -dx;
if(y < 0 || y > 290) dy = -dy;

}

setInterval(pong,20);

</script>
