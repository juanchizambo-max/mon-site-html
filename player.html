<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jouer</title>
<style>
body{
margin:0;
background:black;
}

iframe{
width:100%;
height:100vh;
border:none;
}
</style>
</head>

<body>

<iframe id="gameFrame"></iframe>

<script>
/* récupérer le jeu dans l'URL */
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

/* charger le jeu */
document.getElementById("gameFrame").src = game;
</script>

</body>
</html>
